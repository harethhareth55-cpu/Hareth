<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة تحكم الاشتراكات</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<section id="admin-auth" class="auth-screen">
  <div class="auth-box">
    <h1>🔑 لوحة الإدارة</h1>
    <p class="hint">هذا الدخول مخصص لصاحب التطبيق بس — بريدك اللي حددته بملف firestore.rules.</p>
    <form id="admin-login-form" class="auth-form">
      <input id="admin-email" type="email" placeholder="البريد الإلكتروني" required>
      <input id="admin-password" type="password" placeholder="كلمة المرور" required minlength="6">
      <button type="submit" class="btn primary">دخول / إنشاء حساب الإدارة</button>
    </form>
    <p id="admin-auth-error" class="auth-error hidden"></p>
    <p id="admin-auth-loading" class="auth-loading hidden">جاري التحميل...</p>
  </div>
</section>

<div id="admin-shell" class="hidden admin-shell">
  <header class="app-header">
    <h1>🔑 لوحة تحكم الاشتراكات</h1>
    <button id="admin-logout" class="btn secondary small">🚪 خروج</button>
  </header>
  <main>
    <h2>طلبات دفع بانتظار المراجعة</h2>
    <div class="table-wrap">
      <table id="admin-requests-table">
        <thead>
          <tr>
            <th>المحل</th>
            <th>الخطة</th>
            <th>المبلغ</th>
            <th>الطريقة</th>
            <th>المرجع</th>
            <th>ملاحظة</th>
            <th>التاريخ</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="admin-requests-body"></tbody>
      </table>
    </div>
    <p id="admin-requests-empty" class="empty-msg hidden">لا توجد طلبات جديدة الحين</p>

    <h2>كل المحلات</h2>
    <div class="table-wrap">
      <table id="admin-stores-table">
        <thead>
          <tr>
            <th>اسم المحل</th>
            <th>الحالة</th>
            <th>الخطة</th>
            <th>ينتهي بتاريخ</th>
          </tr>
        </thead>
        <tbody id="admin-stores-body"></tbody>
      </table>
    </div>
  </main>
</div>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
